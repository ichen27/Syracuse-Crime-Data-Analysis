[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "syracuse-crime-analysis"
version = "0.2.0"
description = "Audited, reproducible analysis of a historical Syracuse crime-record snapshot"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<3", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
syracuse-analyze = "syracuse_crime.analysis:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
exclude = ["legacy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
